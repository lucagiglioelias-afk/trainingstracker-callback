<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Trainingstracker – Spotify</title>
<style>
  html,body{height:100%;margin:0;background:#0b0b0d;color:#f2f2f5;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
  body{display:flex;align-items:center;justify-content:center;text-align:center;padding:0 24px}
  p{color:#8c8c96;font-size:15px;line-height:1.45}
</style>
<script>
  // Rückleitung der Spotify-Anmeldung in die Trainingstracker-iOS-App (Capacitor, capacitor://localhost).
  // Nur Weitergabe von code/state an die App; die App selbst löst den Code mit ihrem PKCE-Verifier ein.
  (function () {
    var q = location.search, state = new URLSearchParams(q).get('state') || '';
    if (q && state.indexOf('app.') === 0) location.replace('capacitor://localhost/' + q);
  })();
</script>
</head>
<body>
  <div>
    <h2>Zurück zum Trainingstracker …</h2>
    <p>Diese Seite reicht nur die Spotify-Anmeldung an die Trainingstracker-App weiter.</p>
  </div>
</body>
</html>
